# The game's Linux checks (design_doc §2.8, M0 part): hygiene, build with warnings as errors, tests. The app targets are
# left out (they need iOS); the Swift packages build and test here.
name: ci-linux
on:
  push:
    branches: [main, 'claude/**']
    paths: ['Package.swift', 'Sources/**', 'Tests/**', 'App/**', '.github/workflows/ci-linux.yml', 'tools/checks/**', 'tags.lock', 'content/**']
  pull_request:
    paths: ['Package.swift', 'Sources/**', 'Tests/**', 'App/**', '.github/workflows/ci-linux.yml', 'tools/checks/**', 'tags.lock', 'content/**']
  workflow_dispatch:
concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Hygiene
        shell: bash
        run: |
          set -e
          if find . -name '*.xcodeproj' -o -name '*.xcworkspace' | grep -q .; then
            echo "No Xcode project in the tree: XcodeGen makes it from App/project.yml"; exit 1; fi
          # imports: an allow list. SaneiCore imports nothing; SaneiEngine and SaneiContent only SaneiCore (any attribute,
          # access level or kind). Each file is read with trailing // comments cut and statements split at ';'.
          # Known gaps: an import split over two lines; a // inside a string literal.
          IMP='^\s*(@\w+(\([^)]*\))?\s+)*((public|internal|package|private|fileprivate)\s+)?import\s'
          stmts() { sed -E 's://.*$::; s/;/\n/g' "$1"; }
          bad=""
          for f in $(find Sources/SaneiCore -name '*.swift'); do
            o=$(stmts "$f" | grep -nE "$IMP" || true); [ -n "$o" ] && bad="$bad$f: $o"$'\n'
          done
          for f in $(find Sources/SaneiEngine Sources/SaneiContent -name '*.swift'); do
            o=$(stmts "$f" | grep -nE "$IMP" | grep -vE 'import\s+(\w+\s+)?SaneiCore(\.\w+)*\s*$' || true); [ -n "$o" ] && bad="$bad$f: $o"$'\n'
          done
          if [ -n "$bad" ]; then echo "$bad"; echo "SaneiCore imports nothing; SaneiEngine and SaneiContent only SaneiCore: the standard library only (§2.2)"; exit 1; fi
          # JSON and SaneiBake stay offline (L2): JSON only in SaneiBake, and only simcli and the tests import SaneiBake
          off=""
          for f in $(find Sources App -name '*.swift' -not -path 'Sources/SaneiBake/*'); do
            o=$(sed -E 's://.*$::' "$f" | grep -nE '\bJSON(Serialization|Decoder|Encoder)\b' || true); [ -n "$o" ] && off="$off$f: $o"$'\n'
          done
          for f in $(find Sources App -name '*.swift' -not -path 'Sources/SaneiBake/*' -not -path 'Sources/simcli/*'); do
            o=$(stmts "$f" | grep -nE "$IMP" | grep -E 'import\s+(\w+\s+)?SaneiBake\b' || true); [ -n "$o" ] && off="$off$f: $o"$'\n'
          done
          if grep -nE 'SaneiBake' App/project.yml; then off="${off}App/project.yml links SaneiBake"$'\n'; fi
          if [ -n "$off" ]; then echo "$off"; echo "Nothing is parsed on the phone: JSON lives only in SaneiBake, which only simcli and the tests link (L2)"; exit 1; fi
          # the content's lookups walk no dictionary or set (T-042: a search by halving over each table's IDs)
          if sed -E 's://.*$::' Sources/SaneiContent/*.swift | grep -nE '\b(Dictionary|Set)\b|\[:\]|\[ *("[^"]*"|[0-9]+|\.[A-Za-z_]+|\[[^]]*\]|[A-Za-z_][A-Za-z0-9_.<>?]*) *: *[^] ]'; then
            echo "SaneiContent keeps no dictionary or set: its lookups search sorted IDs (T-042)"; exit 1; fi
          # the simulation's sources: SaneiCore's numbers, the content and the engine built on them
          SIM="Sources/SaneiCore Sources/SaneiContent Sources/SaneiEngine"
          if grep -rnE '\b(Float(16|32|64|80)?|Double|CGFloat|CFloat|CDouble|CLongDouble)\b' $SIM; then
            echo "SaneiCore, SaneiContent and SaneiEngine never use floating point (§2.2, L5)"; exit 1; fi
          # floating-point literals, per file with comments left out («§2.4» is a section): 1.5, 1e9, 2.5e-3, the 2.5 of
          # 1...2.5, hex floats (0x1.8p3); grouping with _ included; member access such as a.0 excluded.
          # Known gap: Duration / Duration returns a Double with no keyword or literal in the source.
          lit='(^|[^0-9A-Za-z_.])[0-9][0-9_]*(\.[0-9][0-9_]*([eE][-+]?[0-9]+)?|[eE][-+]?[0-9]+)\b|\.\.[.<]?[0-9][0-9_]*\.[0-9]|0x[0-9A-Fa-f_]*(\.[0-9A-Fa-f_]+)?[pP][-+]?[0-9]'
          found=0
          for f in $(find $SIM -name '*.swift'); do
            out=$(sed -E 's://.*$::' "$f" | grep -nE "$lit" || true)
            if [ -n "$out" ]; then echo "$out" | sed "s|^|$f:|"; found=1; fi
          done
          if [ "$found" = 1 ]; then echo "SaneiCore, SaneiContent and SaneiEngine never use floating-point literals (§2.2, L5)"; exit 1; fi
          # randomness and hashing that differ between runs or Swift versions (ADR 0002): the standard library's
          # generator and its range mappings, and hash values, which are seeded per process. Comments left out.
          # (`DetRNG.shuffle(&items)` is the project's own deterministic shuffle: only the standard library's shapes,
          # `.shuffle()` and `.shuffle(using:)`, are banned)
          # (a space before or inside the parenthesis, or `using:` on the next line, is still caught)
          rnd='\.(random|randomElement|shuffled)\s*\(|\.shuffle\s*\(\s*([^&[:space:]]|$)|\bSystemRandomNumberGenerator\b|\bhashValue\b|\bHasher\b'
          found=0
          for f in $(find $SIM -name '*.swift'); do
            out=$(sed -E 's://.*$::' "$f" | grep -nE "$rnd" || true)
            if [ -n "$out" ]; then echo "$out" | sed "s|^|$f:|"; found=1; fi
          done
          if [ "$found" = 1 ]; then echo "The simulation draws only from DetRNG and never reads a hash value (ADR 0002)"; exit 1; fi
          # money is never rebuilt from another unit's raw value in the engine (ADR 0003): `LCU(raw: dollars.raw)`,
          # `.init(raw: x.raw)`, `LCU(raw: Int64(x.raw))`, `LCU( raw : (d).raw)`, `a.raw = b.raw`, `a.raw += b.raw` (a
          # generic helper, a value passed through a local, or a call split over lines is not seen: reviews check those)
          xu='(\b(LCU|USDn|Money)|\.init)\s*\(\s*raw\s*:.*\.raw\b|\.raw\s*([-+*/%&|^]|&[-+*]|<<|>>)?=[^=]'
          found=0
          for f in $(find Sources/SaneiEngine -name '*.swift'); do
            out=$(sed -E 's://.*$::' "$f" | grep -nE "$xu" || true)
            if [ -n "$out" ]; then echo "$out" | sed "s|^|$f:|"; found=1; fi
          done
          if [ "$found" = 1 ]; then echo "An amount changes unit only through the ledger's exchange at a rate (ADR 0003)"; exit 1; fi
          # the app's platform and render code never reach into the engine (§2.2: only App/App and App/UI hold it)
          eng=""
          for f in $(find App/Sources/Platform App/Sources/MapRenderer -name '*.swift'); do
            o=$( (stmts "$f" | grep -nE "$IMP" | grep -E 'import\s+(\w+\s+)?SaneiEngine\b'; grep -nE '\bGameHost\b' "$f") || true ); [ -n "$o" ] && eng="$eng$f: $o"$'\n'
          done
          if [ -n "$eng" ]; then echo "$eng"; echo "App/Platform and App/MapRenderer never use the engine (§2.2)"; exit 1; fi
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
      # the units kept apart by type (ADR 0003): wrong-unit postings must not compile
      - name: Units refused by the compiler
        run: tools/checks/units/check.sh .build/debug
      # the app ships optimised: an unchecked read, a different inlining or a removed check shows only in this build
      - name: Build optimised (warnings as errors)
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Test optimised
        run: swift test -c release -Xswiftc -enable-testing -Xswiftc -warnings-as-errors
      # the pinned toolchain's simcli, in two processes (each with its own hash seed), against the bytes the tests pin
      - name: Content validates and bakes the same twice
        run: |
          .build/release/simcli validate
          .build/release/simcli bake --out .build/bundle/content.bin
          .build/release/simcli bake --out .build/bundle/content-again.bin
          cmp .build/bundle/content.bin .build/bundle/content-again.bin
          pin=$(grep -oE 'pinnedContentSHA256 = "[0-9a-f]{64}"' Tests/SaneiContentTests/ContentTests.swift | cut -d'"' -f2)
          test -n "$pin"
          echo "$pin  .build/bundle/content.bin" | sha256sum -c -
          # every failure exits 1 (`if`, as `set -e` ignores a command under `!`): a missing content folder, an option
          # twice, an option given as a value
          if .build/release/simcli validate --content .build/no-such-content 2>/dev/null; then exit 1; fi
          if .build/release/simcli bake --out .build/bundle/x.bin --out .build/bundle/y.bin 2>/dev/null; then exit 1; fi
          if .build/release/simcli bake --out --content 2>/dev/null; then exit 1; fi
          test ! -e .build/bundle/x.bin
  # the reference model (ADR 0002): the generated tables and vectors match it, and its accuracy bounds hold; the ID lock
  # only grows (git alone, no Swift)
  core-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The ID lock check's own test
        shell: bash
        run: tools/checks/ids_lock_test.sh
      - name: The ID lock only grows
        shell: bash
        env:
          TARGET: ${{ github.base_ref || 'main' }}
          BEFORE: ${{ github.event.before }}
        run: tools/checks/ids_lock.sh
      - name: Reference model
        run: python3 -I tools/checks/core_reference.py --check
      - name: Codec reference
        run: python3 -I tools/checks/codec_reference.py --check
