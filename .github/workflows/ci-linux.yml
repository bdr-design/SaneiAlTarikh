# The game's Linux checks (design_doc §2.8, M0 part): hygiene, build with warnings as errors, tests. The app targets are
# left out (they need iOS); the Swift packages build and test here.
name: ci-linux
on:
  push:
    branches: [main, 'claude/**']
    paths: ['Package.swift', 'Sources/**', 'Tests/**', 'App/**', '.github/workflows/ci-linux.yml', 'tools/checks/**']
  pull_request:
    paths: ['Package.swift', 'Sources/**', 'Tests/**', 'App/**', '.github/workflows/ci-linux.yml', 'tools/checks/**']
  workflow_dispatch:
concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Hygiene
        shell: bash
        run: |
          set -e
          if find . -name '*.xcodeproj' -o -name '*.xcworkspace' | grep -q .; then
            echo "No Xcode project in the tree: XcodeGen makes it from App/project.yml"; exit 1; fi
          # imports: an allow list. SaneiCore imports nothing; SaneiEngine only SaneiCore (any attribute, access level or kind)
          imp() { grep -nE '^\s*(@\w+(\([^)]*\))?\s+)*((public|internal|package|private|fileprivate)\s+)?import\s' "$@" || true; }
          bad=$( (imp -r Sources/SaneiCore; imp -r Sources/SaneiEngine | grep -vE 'import\s+(\w+\s+)?SaneiCore(\.\w+)*\s*$') || true )
          if [ -n "$bad" ]; then echo "$bad"; echo "SaneiCore imports nothing and SaneiEngine only SaneiCore: the standard library only (§2.2)"; exit 1; fi
          if grep -rnE '\b(Float(16|32|64|80)?|Double|CGFloat)\b' Sources/SaneiEngine; then
            echo "SaneiEngine never uses floating point (§2.2)"; exit 1; fi
          # floating-point literals, per file with comments left out («§2.4» is a section): 1.5, 1e9, 2.5e-3, the 2.5 of
          # 1...2.5, hex floats (0x1.8p3); grouping with _ included; member access such as a.0 excluded.
          # Known gap until M1a: Duration / Duration returns a Double with no keyword or literal in the source.
          lit='(^|[^0-9A-Za-z_.])[0-9][0-9_]*(\.[0-9][0-9_]*([eE][-+]?[0-9]+)?|[eE][-+]?[0-9]+)\b|\.\.[.<]?[0-9][0-9_]*\.[0-9]|0x[0-9A-Fa-f_]*(\.[0-9A-Fa-f_]+)?[pP][-+]?[0-9]'
          found=0
          for f in $(find Sources/SaneiEngine -name '*.swift'); do
            out=$(sed -E 's://.*$::' "$f" | grep -nE "$lit" || true)
            if [ -n "$out" ]; then echo "$out" | sed "s|^|$f:|"; found=1; fi
          done
          if [ "$found" = 1 ]; then echo "SaneiEngine never uses floating-point literals (§2.2)"; exit 1; fi
          # the app's platform and render code never reach into the engine (§2.2: only App/App and App/UI hold it)
          if grep -rnE '^\s*(@\w+\s+)*import\s+(\w+\s+)?SaneiEngine\b|\bGameHost\b' App/Sources/Platform App/Sources/MapRenderer; then
            echo "App/Platform and App/MapRenderer never use the engine (§2.2)"; exit 1; fi
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
