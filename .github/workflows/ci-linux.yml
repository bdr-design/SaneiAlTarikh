# The game's Linux checks (design_doc §2.8, M0 part): hygiene, build with warnings as errors, tests. The app targets are
# left out (they need iOS); the Swift packages build and test here.
name: ci-linux
on:
  push:
    branches: [main, 'claude/**']
    paths: ['Package.swift', 'Sources/**', 'Tests/**', 'App/**', '.github/workflows/ci-linux.yml', 'tools/checks/**']
  pull_request:
    paths: ['Package.swift', 'Sources/**', 'Tests/**', 'App/**', '.github/workflows/ci-linux.yml', 'tools/checks/**']
  workflow_dispatch:
concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Hygiene
        run: |
          set -e
          if find . -name '*.xcodeproj' -o -name '*.xcworkspace' | grep -q .; then
            echo "No Xcode project in the tree: XcodeGen makes it from App/project.yml"; exit 1; fi
          # every import form: attributes (@preconcurrency, @_exported), access levels, kinds (import struct ...)
          if grep -rnE '^\s*(@\w+\s+)*((public|internal|package|private|fileprivate)\s+)?import\s+(\w+\s+)?(Foundation\w*|Dispatch|CoreFoundation|Glibc|Darwin|Musl|WinSDK|ucrt|os)\b' Sources/SaneiCore Sources/SaneiEngine; then
            echo "SaneiCore and SaneiEngine import the standard library only: no Foundation, Dispatch or C library (§2.2)"; exit 1; fi
          if grep -rnE '\b(Float(16|32|64|80)?|Double|CGFloat)\b' Sources/SaneiEngine; then
            echo "SaneiEngine never uses floating point (§2.2)"; exit 1; fi
          # floating-point literals: 1.5, 1e9, 2.5e-3 (digit grouping with _ included); hex and member access excluded
          # (comments are left out: «§2.4» is a section, not a number)
          if find Sources/SaneiEngine -name '*.swift' -exec sed -E 's://.*$::' {} + | grep -nE '(^|[^0-9A-Za-z_.])[0-9][0-9_]*(\.[0-9][0-9_]*([eE][-+]?[0-9]+)?|[eE][-+]?[0-9]+)\b'; then
            echo "SaneiEngine never uses floating-point literals (§2.2)"; exit 1; fi
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
