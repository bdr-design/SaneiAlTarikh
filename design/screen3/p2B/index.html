<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختيار الدولة B</title>
<script>
  /* Device frame from the URL (points): ?w=844&h=390&side=47&bottom=21&cutout=notch|island|none
     Optional: &hit=1 draws the 44 pt hit boxes and the safe area.
     Same responsive system as the approved screens (screen1/B3, screen2/B). */
  (function () {
    var q = new URLSearchParams(location.search);
    function n(k, d) { var v = parseFloat(q.get(k)); return isFinite(v) ? v : d; }
    var W = n('w', 844), H = n('h', 390), SIDE = n('side', 47), BOTTOM = n('bottom', 21);
    var CUT = q.get('cutout') || 'notch';
    if (['notch', 'island', 'none'].indexOf(CUT) < 0) CUT = 'none';
    var r = document.documentElement, s = r.style;
    s.setProperty('--w', W + 'px');
    s.setProperty('--h', H + 'px');
    s.setProperty('--side', SIDE + 'px');
    s.setProperty('--bottom', BOTTOM + 'px');
    s.setProperty('--corner', (CUT === 'none' ? 0 : 39) + 'px');
    r.dataset.cutout = CUT;
    r.dataset.home = BOTTOM > 0 ? 'yes' : 'no';
    if (q.get('hit') === '1') r.classList.add('show-hit');
    window.__dev = { W: W, H: H, SIDE: SIDE, BOTTOM: BOTTOM, CUT: CUT };
  })();
</script>
<style>
  :root {
    /* device (overwritten from the URL) */
    --w: 844px; --h: 390px; --side: 47px; --bottom: 21px; --corner: 39px;
    /* safe layout box: never inside the side insets; the 44 pt bottom row ends 4 pt above the home indicator
       inset, 8 pt from the edge on SE (the same spot for the primary button as on pages 1 and 3) */
    --gutter: max(var(--side), 8px);
    --top-gap: 8px;
    --row-gap: max(calc(var(--bottom) + 4px), 8px);

    /* ===== the approved slim system (screen1/B3, screen2/B) ===== */
    --ctl: 32px;  --row: 36px;  --big: 44px;      /* the only control heights */
    --r-bar: 12px;  --r-ctl: 10px;                 /* cards / bars, controls */
    --pad-bar: 12px;  --pad-ctl: 10px;
    --s1: 4px; --s2: 8px; --s3: 12px;               /* spacing scale */
    --fs-label: 10px;   --lh-label: 12px;
    --fs-sec: 11.5px;   --lh-sec: 14px;
    --fs-val: 13px;     --lh-val: 16px;            /* semibold, tabular */
    --fs-name: 14px;    --lh-name: 17px;           /* bold */
    --fs-title: 18px;   --lh-title: 22px;          /* page title only */
    --ico: 16px;

    --glass: rgba(9, 17, 25, 0.66);
    --stroke: rgba(127, 233, 255, 0.14);
    --hair: rgba(127, 233, 255, 0.13);
    --t1: #EAF2F7;
    --t2: #A9BCCB;
    --cyan: #7FE9FF;
    --teal: #3FE0D0;
    --amber: #F2B14C;
    --red: #F2705A;
    --on-cyan: #060B10;   /* the same dark ink as p1B / p3B */

    /* difficulty scale */
    --d1: var(--teal);   /* سهلة */
    --d2: var(--t2);     /* متوسطة: the secondary text colour (no off-palette blue), as p2A */
    --d3: var(--amber);  /* صعبة */
    --d4: var(--red);    /* صعبة جدًا */

    --card-w: 264px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    position: relative;
    background: #0B1218;
    color: var(--t1);
    font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    line-height: 1;
  }
  button, input { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: inherit; }
  ol, ul { list-style: none; }
  svg.i { width: var(--ico); height: var(--ico); fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
  .ltr { direction: ltr; unicode-bidi: isolate; }

  /* ---------- Touch targets: invisible ::before box of at least 44 x 44 pt (as screen1) ---------- */
  .tap { position: relative; }
  .tap::before {
    content: ""; position: absolute;
    left: calc(50% + var(--hx, 0px)); top: calc(50% + var(--hy, 0px));
    width: max(100%, 44px); height: max(100%, 44px);
    transform: translate(-50%, -50%);
  }
  .glass.tap::before { width: max(100% + 2px, 44px); height: max(100% + 2px, 44px); }
  .show-hit .tap::before { outline: 1px solid rgba(255, 60, 160, 0.9); background: rgba(255, 60, 160, 0.12); z-index: 5; }

  /* ---------- The map: approved world satellite + overlay, full-bleed, interactive ---------- */
  .map { position: absolute; left: 0; top: 0; width: calc(2400px * var(--map-s, 1)); height: calc(1202px * var(--map-s, 1)); }
  .map img, .map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* borders and names sit back a little, so the map stays calm; the selected country is redrawn at full strength on top */
  .map .ov, .frost img.ov { opacity: 0.82; }
  /* map names that would collide with the bottom row (cut by the top edge of the chips, or showing through the strip's
     faded end) are taken out of the overlay by declutter(): a mask with holes in the shape of those names only */
  .map img.ov, .frost img.ov { -webkit-mask-image: var(--ov-mask, none); mask-image: var(--ov-mask, none);
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  /* calm shade: a little overall dim, a soft lens vignette, and darker bands where the glass sits */
  .shade { position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(6, 11, 16, 0.60) 0, rgba(6, 11, 16, 0.20) 24%, rgba(6, 11, 16, 0) 40%),
      linear-gradient(to top, rgba(6, 11, 16, 0.74) 0, rgba(6, 11, 16, 0.30) 20%, rgba(6, 11, 16, 0) 40%),
      radial-gradient(ellipse 85% 95% at 55% 50%, rgba(6, 11, 16, 0) 55%, rgba(6, 11, 16, 0.45) 100%),
      linear-gradient(rgba(6, 11, 16, 0.14), rgba(6, 11, 16, 0.14));
  }
  /* the link from the selected country to its card */
  .lead { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); pointer-events: none; overflow: visible; }

  /* ---------- Glass: one look for every panel (as screen1/screen2) ---------- */
  .glass {
    position: relative;
    isolation: isolate;
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(1.1);
    backdrop-filter: blur(18px) saturate(1.1);
    border: 1px solid var(--stroke);
    border-radius: var(--r);
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.26);
  }
  .bar, .card { --r: var(--r-bar); }
  .ctl { --r: var(--r-ctl); }
  /* render-side frost (see frost() below): a blurred copy of the map + shade under the same 0.66 tint */
  .frost { position: absolute; inset: 0; z-index: -1; overflow: hidden; border-radius: calc(var(--r) - 1px); pointer-events: none; background: #0B1218; }
  .frost i { position: absolute; display: block; filter: blur(18px) saturate(1.1); }
  .frost i img, .frost i b { position: absolute; display: block; }
  .frost::after { content: ""; position: absolute; inset: 0; background: var(--glass); }
  .frosted .glass { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }

  .ui { position: absolute; inset: 0; pointer-events: none; }
  .ui .glass, .ui .tap { pointer-events: auto; }

  /* ---------- Shared header: one 36 pt glass bar ---------- */
  .top { position: absolute; top: var(--top-gap); left: var(--gutter); right: var(--gutter); height: var(--row);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-inline: 2px; }
  /* back: a 32 pt control 2 pt inside the bar (12 - 2 = 10 pt radius, concentric, as the screen1 speed chip) */
  .back { --r: var(--r-ctl); justify-self: start; height: var(--ctl); display: flex; align-items: center; gap: var(--s1);
    padding-inline: var(--s2) var(--pad-ctl); border-radius: var(--r); color: var(--t1);
    background: rgba(127, 233, 255, 0.07); }
  .back span { font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); white-space: nowrap; }
  .back svg.i { color: var(--t2); }

  .steps { display: flex; align-items: center; gap: var(--s2); }
  .step { display: flex; align-items: center; gap: var(--s2); white-space: nowrap; }
  .step .n { flex: none; width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center;
    font-size: var(--fs-sec); font-weight: 600; line-height: var(--lh-sec); color: var(--t2); box-shadow: inset 0 0 0 1px rgba(169, 188, 203, 0.45); }
  .step .l { font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); color: var(--t2); }
  .step.done .n { color: var(--teal); background: rgba(63, 224, 208, 0.14); box-shadow: inset 0 0 0 1px rgba(63, 224, 208, 0.50); }
  .step.done .n svg.i { width: 16px; height: 16px; stroke-width: 1.75; }
  .step.done .l { color: var(--t1); }
  .step.cur .n { background: var(--cyan); color: var(--on-cyan); box-shadow: none; }
  .step.cur .l { color: var(--cyan); }
  .sep { flex: none; width: 20px; height: 1px; background: rgba(169, 188, 203, 0.35); }
  .sep.done { background: rgba(63, 224, 208, 0.55); }

  /* the bar's padding is 2 pt on both sides (as pages 1 and 3) so the steps sit on the bar's centre on all three pages;
     the 10 pt margin keeps the context 12 pt in from the bar's RTL end */
  .ctx { justify-self: end; margin-inline-end: var(--pad-ctl); display: flex; align-items: center; gap: var(--s1); white-space: nowrap;
    font-size: var(--fs-sec); font-weight: 500; line-height: var(--lh-sec); color: var(--t2); }
  .ctx b { font-weight: 600; color: var(--t1); }

  /* ---------- Search: a floating 32 pt field, top centre under the header ---------- */
  .search { position: absolute; top: calc(var(--top-gap) + var(--row) + var(--s2)); left: calc(50% - 132px); width: 264px; height: var(--ctl);
    display: flex; align-items: center; gap: var(--s2); padding-inline: var(--pad-ctl); color: var(--t2); cursor: text; }
  .search .ph { flex: 1 1 auto; font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); color: var(--t2); white-space: nowrap; }
  .search .cnt { flex: none; font-size: var(--fs-label); font-weight: 500; line-height: var(--lh-label); color: var(--t2); white-space: nowrap;
    padding-inline-start: var(--s2); border-inline-start: 1px solid var(--hair); }

  /* ---------- Selected-country card: floats at the right, next to Egypt ---------- */
  .card.sel { position: absolute; right: var(--gutter); width: var(--card-w); padding: var(--pad-bar);
    display: flex; flex-direction: column; gap: var(--s3); }
  .sel .head { display: flex; align-items: center; gap: var(--s3); }
  .flag { flex: none; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.22); }
  .flag img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .sel .flag { width: 32px; height: 24px; }
  .sel .nm { font-size: var(--fs-name); font-weight: 700; line-height: var(--lh-name); color: var(--t1); flex: 1 1 auto; }
  .sel .pick { flex: none; display: flex; align-items: center; gap: var(--s1); color: var(--cyan);
    font-size: var(--fs-sec); font-weight: 600; line-height: var(--lh-sec); white-space: nowrap; }
  .sel hr { border: 0; height: 1px; background: var(--hair); }
  .facts { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--s3); row-gap: var(--s3); }
  .fact { display: flex; flex-direction: column; min-width: 0; }
  .fact .k { font-size: var(--fs-label); font-weight: 500; line-height: var(--lh-label); color: var(--t2); white-space: nowrap; }
  .fact .v { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); color: var(--t1); white-space: nowrap; }
  .fact .v .u { font-size: var(--fs-label); font-weight: 500; color: var(--t2); }
  .fact .v.hard { color: var(--amber); }
  /* difficulty meter: four short bars, filled up to the level */
  .meter { display: flex; align-items: center; gap: 2px; direction: rtl; }   /* RTL: the level fills from the right */
  .meter i { display: block; width: 4px; height: 10px; border-radius: 1px; background: rgba(169, 188, 203, 0.28); }
  .meter i.on { background: currentColor; }
  .warn { display: flex; align-items: flex-start; gap: var(--s2); }
  .warn svg.i { color: var(--amber); margin-top: -1px; }
  .warn p { font-size: var(--fs-sec); font-weight: 500; line-height: var(--lh-sec); color: var(--t1); }
  .warn p b { font-weight: 600; color: var(--amber); }

  /* ---------- Bottom row: country chips (scrolls) + the primary action ---------- */
  .bottom { position: absolute; left: var(--gutter); right: var(--gutter); bottom: var(--row-gap); height: var(--big);
    display: flex; align-items: center; gap: var(--s3); }
  /* the strip scrolls sideways; its box is taller than the row only so the chips' soft shadow is not cut.
     That extra box reaches into the home-indicator inset, so the box itself takes no touches: the chips do
     (the app's scroller is the 44 pt row, above the inset) */
  .strip { flex: 1 1 auto; min-width: 0; align-self: stretch; margin-block: -8px; padding-block: 12px;
    display: flex; align-items: center; gap: var(--s2); overflow-x: clip; overflow-y: visible;
    /* the RTL end of the strip (left, next to the primary action) fades out over 64 pt: more countries scroll in from there.
       --fade-0 is a clear run before that ramp, set by placeStrip() from measurement so the fade never lands across a
       chip's name: the end chip's name stays readable (at least 0.55, as on the approved iPhone 17 Pro Max) or is fully
       out, and then only its flag fades in */
    -webkit-mask-image: linear-gradient(to right, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) var(--fade-0, 0px), #000 calc(var(--fade-0, 0px) + 64px));
    mask-image: linear-gradient(to right, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) var(--fade-0, 0px), #000 calc(var(--fade-0, 0px) + 64px)); pointer-events: none; }
  .chip { flex: none; height: var(--row); display: flex; align-items: center; gap: var(--s2); padding-inline: var(--pad-ctl) var(--pad-bar); }
  .chip .flag { width: 22px; height: 16.5px; }
  .chip .tx { display: flex; flex-direction: column; align-items: flex-start; }
  .chip .nm { font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); color: var(--t1); white-space: nowrap; }
  .chip .df { font-size: var(--fs-label); font-weight: 500; line-height: var(--lh-label); white-space: nowrap; }
  .df.d1 { color: var(--d1); } .df.d2 { color: var(--d2); } .df.d3 { color: var(--d3); } .df.d4 { color: var(--d4); }
  .chip.on { box-shadow: 0 3px 14px rgba(0, 0, 0, 0.26), inset 0 0 0 1px rgba(127, 233, 255, 0.55); border-color: rgba(127, 233, 255, 0.55); }
  .chip.on .frost::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(127, 233, 255, 0.20), rgba(127, 233, 255, 0.10)); }

  .next { --r: var(--r-ctl); flex: none; height: var(--big); min-width: 120px; padding-inline: var(--pad-bar);
    display: flex; align-items: center; justify-content: center; gap: var(--s2); border-radius: var(--r);
    background: var(--cyan); color: var(--on-cyan); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  .next span { font-size: var(--fs-name); font-weight: 700; line-height: var(--lh-name); white-space: nowrap; }
  .next svg.i { stroke-width: 2; }

  /* ---------- Fit levels (set by fit() from measurement, not from the device name) ----------
     0: everything   1: header context shows only the scenario name   2: no header context */
  [data-fit="1"] .ctx .dt { display: none; }
  [data-fit="2"] .ctx { visibility: hidden; }
  /* card fit (set by placeCard() when the free band is short, e.g. iPhone SE): 8 pt instead of 12 pt between its blocks */
  [data-cardfit="1"] .card.sel { gap: var(--s2); }
  [data-cardfit="1"] .facts { row-gap: var(--s2); }

  /* ---------- Device overlay (as screen1/screen2) ---------- */
  .dev { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
  .corners { position: absolute; inset: 0; border-radius: var(--corner); box-shadow: 0 0 0 60px #000; }
  .cutout { position: absolute; background: #000; display: none; }
  [data-cutout="island"] .cutout { display: block; left: 11px; top: calc(50% - 63px); width: 37px; height: 126px; border-radius: 18.5px; }
  [data-cutout="notch"] .cutout { display: block; left: 0; top: calc(50% - 105px); width: 30px; height: 210px; border-radius: 0 20px 20px 0; }
  .homebar { position: absolute; display: none; left: calc(50% - 67px); bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.55); }
  [data-home="yes"] .homebar { display: block; }
  .show-hit .safe { position: absolute; top: 0; bottom: var(--bottom); left: var(--side); right: var(--side); outline: 1px dashed rgba(255, 255, 0, 0.8); }
</style>
</head>
<body>

<!-- SVG symbol library (24 grid, round stroke 1.75, drawn at 16 pt) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.75" cy="10.75" r="6.25"/><path d="M15.3 15.3 20 20"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M6 12.5l3.75 3.75L18 8"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.4 4.6a1.85 1.85 0 0 1 3.2 0l7.1 12.6a1.85 1.85 0 0 1-1.6 2.8H4.9a1.85 1.85 0 0 1-1.6-2.8z"/><path d="M12 9.5v4"/><path d="M12 16.6v.05"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.75"/><path d="M8.25 12.25l2.6 2.6 5-5.35"/></symbol>
  </defs>
</svg>

<!-- The map: approved world satellite + overlay (Egypt highlighted), placed by placeMap() -->
<div class="map" aria-label="خريطة العالم: اضغط على دولة لاختيارها">
  <img src="../../shared/world_d1.jpg" alt="">
  <img class="ov" src="world_d1_overlay_declutter.svg" alt="">   <!-- the approved overlay with its 7 colliding labels resolved (Spain/Portugal etc.) -->
  <!-- selected country: the same highlight as the approved overlay (fill 0.16, soft 7 pt glow, 2 pt line), at full strength -->

  /* Header: hide the scenario context step by step if the bar gets tight (measured, not by device). */
  function fit() {
    var root = document.documentElement, top = document.querySelector('.top');

    for (var lv = 0; lv <= 2; lv++) {
      root.dataset.fit = String(lv);
      var cs = getComputedStyle(top), inner = top.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      var steps = parts[1].getBoundingClientRect().width, side = (inner - steps) / 2;
      var ctxM = parseFloat(getComputedStyle(parts[2]).marginLeft) + parseFloat(getComputedStyle(parts[2]).marginRight);   /* the context's 10 pt end margin */
      var ok = parts[0].getBoundingClientRect().width + 12 <= side && (lv === 2 || parts[2].getBoundingClientRect().width + ctxM + 12 <= side);
      if (ok) break;
    }
    window.__fit = { level: +root.dataset.fit };
  }

  /* Composition. Egypt sits a little below the middle of the free band (so southern and central
     Europe stay in view above it), just to the left of the card; the card floats at the right,
     vertically centred on Egypt as far as the band allows. The band runs from the search field
     (or 8 pt under it, when the card would sit beside it) to 12 pt above the bottom row. */
  var EG = { x0: 1364.7, x1: 1445.8, y0: 546.5, y1: 615.6, cy: 581, ax: 1426, ay: 566 };
  function placeCard() {
    var root = document.documentElement, card = document.querySelector('.sel');
    var s = document.querySelector('.search').getBoundingClientRect(), b = document.querySelector('.bottom').getBoundingClientRect();
    var c = card.getBoundingClientRect();
    var beside = c.left < s.right + 12;                       /* would the card touch the search field horizontally? */
    var y0 = beside ? s.bottom + 8 : s.top, y1 = b.top - 12;
    root.dataset.cardfit = '0';
    if (card.getBoundingClientRect().height > y1 - y0) root.dataset.cardfit = '1';
    var h = card.getBoundingClientRect().height;
    var ey = y0 + (y1 - y0) * 0.6;                             /* Egypt's centre on screen */
    var top = Math.min(Math.max(ey - h / 2, y0), y1 - h);
    /* close under the search field (less than 24 pt) the two panels read as a stack: snap to a token gap (12 pt) under
       the field rather than the raw Egypt-centred value, as long as the card still ends 12 pt above the chips (which sit
       4 pt inside the row) */
    if (beside && top - s.bottom < 24) top = Math.min(s.bottom + 12, b.top + 4 - 12 - h);
    card.style.top = top + 'px';
    window.__band = { y0: y0, y1: y1, ey: ey };
    window.__card = { y0: y0, y1: y1, h: h, top: top, fits: h <= y1 - y0, fit: +root.dataset.cardfit };
  }

      if (cut(st.left + st.f0, strip.right, chip.top)) why = 'chips edge';
      else if (cut(nx.left, nx.right, nx.top)) why = 'action edge';
      else if (ink.x1 + halo > st.left && ink.x0 - halo < st.left + st.f0 + FADE && ink.y1 > chip.top + 4 && ink.y0 < chip.bottom - 4) why = 'faded end';
      if (why) hidden.push({ t: lb[3], why: why, ink: ink, lb: lb });
    });
    var root = document.documentElement;
    if (hidden.length) {
      var txt = hidden.map(function (h) {
        return '<text x="' + h.lb[0] + '" y="' + h.lb[1] + '" font-size="' + h.lb[2] + '">' + h.lb[3] + '</text>';
      }).join('');
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1202" width="2400" height="1202" preserveAspectRatio="none">' +
        '<mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="2400" height="1202"><rect width="2400" height="1202" fill="#fff"/>' +
        '<g font-family="' + LABEL_FONT.replace(/"/g, '') + '" font-weight="700" text-anchor="middle" fill="#000" stroke="#000" stroke-width="7" stroke-linejoin="round">' + txt + '</g></mask>' +
        '<rect width="2400" height="1202" fill="#fff" mask="url(#m)"/></svg>';
      root.style.setProperty('--ov-mask', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
    } else root.style.removeProperty('--ov-mask');
    window.__labels = hidden.map(function (h) { return { t: h.t, why: h.why, x0: +h.ink.x0.toFixed(1), x1: +h.ink.x1.toFixed(1), y0: +h.ink.y0.toFixed(1), y1: +h.ink.y1.toFixed(1) }; });
  }

  /* Frosted glass for the mockup render (as screen1/screen2): headless Chromium leaves a sharp copy
     of image content under backdrop-filter, so each panel gets its own clipped copy of the map and
     the shade, blurred with filter: blur(), under the same 0.66 tint. backdrop-filter stays as the fallback. */
  function frost() {
    var d = window.__dev, W = d.W, H = d.H;
    var m = document.querySelector('.map').getBoundingClientRect();
    var imgs = document.querySelectorAll('.map img');
    var shade = getComputedStyle(document.querySelector('.shade')).backgroundImage;
    Array.prototype.forEach.call(document.querySelectorAll('.ui .glass'), function (g) {
      var f = g.querySelector(':scope > .frost');
      if (!f) {
        f = document.createElement('span'); f.className = 'frost'; f.setAttribute('aria-hidden', 'true');
        var i = document.createElement('i');
        Array.prototype.forEach.call(imgs, function (src) { var im = document.createElement('img'); im.src = src.src; im.className = src.className; i.appendChild(im); });
        i.appendChild(document.createElement('b'));
        f.appendChild(i);
        g.insertBefore(f, g.firstChild);
      }
      var r = g.getBoundingClientRect(), cs = getComputedStyle(g), i2 = f.firstChild;
      i2.style.left = (-r.left - parseFloat(cs.borderLeftWidth)) + 'px';
      i2.style.top = (-r.top - parseFloat(cs.borderTopWidth)) + 'px';
      i2.style.width = W + 'px'; i2.style.height = H + 'px';
      Array.prototype.forEach.call(i2.querySelectorAll('img'), function (im) {
        im.style.left = m.left + 'px'; im.style.top = m.top + 'px'; im.style.width = m.width + 'px'; im.style.height = m.height + 'px';
      });
      var b = i2.querySelector('b');
      b.style.left = '0px'; b.style.top = '0px'; b.style.width = W + 'px'; b.style.height = H + 'px'; b.style.backgroundImage = shade;
    });
    document.documentElement.classList.add('frosted');
  }

  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
    .then(fit).then(placeCard).then(placeMap).then(placeStrip).then(declutter).then(frost).then(function () { window.__ready = true; });
</script>
