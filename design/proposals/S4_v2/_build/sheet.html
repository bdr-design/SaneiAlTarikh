  <!-- Province panel, version 2 (bigger, calmer): ?theme=8 olive military, ?theme=9 sand dossier -->
  <section class="sheet glass" aria-label="المحافظة: القاهرة">
    <div class="q-in">
      <header class="q-hd">
        <span class="q-flag"><img src="../../shared/flags/eg.svg" alt="علم مصر"></span>
        <div class="q-tt">
          <div class="q-row"><h2 class="q-name">القاهرة</h2><span class="q-cap"><svg class="i"><use href="#i-star"/></svg><span>العاصمة</span></span></div>
          <div class="q-sub">مصر<span class="q-dot"> · </span>محافظة</div>
        </div>
        <button class="q-more tap"><span>التفاصيل</span><svg class="i"><use href="#i-chev"/></svg></button>
        <button class="q-x tap" aria-label="إغلاق"><svg class="i"><use href="#i-close"/></svg></button>
      </header>

      <p class="q-status"><svg class="i"><use href="#i-shield"/></svg><span>سيادة وإدارة <b>مصر</b><span class="q-dot"> · </span>سيطرة <b>الحكومة <span class="ltr">100%</span></b><span class="q-dot"> · </span>لا مطالبات</span></p>

      <div class="q-kpis">
        <button class="q-kpi tap" aria-label="السكان 8.8 مليون، لماذا؟">
          <span class="q-ic"><svg class="i"><use href="#i-people"/></svg></span>
          <span class="q-kl">السكان</span>
          <span class="q-kv"><span class="q-n ltr">8.8</span><span class="q-u">مليون</span></span>
          <span class="q-why"><svg class="q-tr q-flat"><use href="#t-flat"/></svg>لماذا؟</span>
        </button>
        <button class="q-kpi tap q-warn" aria-label="الاضطراب 64، يرتفع، لماذا؟">
          <span class="q-ic"><svg class="i"><use href="#i-flame"/></svg></span>
          <span class="q-kl">الاضطراب</span>
          <span class="q-kv"><span class="q-n ltr">64</span><span class="q-u">/ 100</span></span>
          <span class="q-why"><svg class="q-tr q-up"><use href="#t-up"/></svg>لماذا؟</span>
        </button>
        <button class="q-kpi tap" aria-label="البنية التحتية 8 من 10، لماذا؟">
          <span class="q-ic"><svg class="i"><use href="#i-build"/></svg></span>
          <span class="q-kl">البنية التحتية</span>
          <span class="q-kv"><span class="q-n ltr">8</span><span class="q-u">/ 10</span></span>
          <span class="q-why"><svg class="q-tr q-flat"><use href="#t-flat"/></svg>لماذا؟</span>
        </button>
      </div>

      <div class="q-acts" aria-label="الإجراءات">
        <button class="q-act tap q-first">
          <span class="q-ai"><svg class="i"><use href="#i-build"/></svg></span>
          <span class="q-an">مشروع بنية تحتية</span>
          <span class="q-ac"><span class="ltr">0.8</span> مليار $ · <span class="ltr">24</span> شهرًا</span>
          <span class="q-ae q-good"><svg class="q-tr q-up"><use href="#t-up"/></svg><span class="ltr">+1</span> بنية تحتية</span>
        </button>
        <button class="q-act tap">
          <span class="q-ai"><svg class="i"><use href="#i-care"/></svg></span>
          <span class="q-an">دعم الخدمات</span>
          <span class="q-ac"><span class="ltr">0.3</span> مليار $</span>
          <span class="q-ae q-good"><svg class="q-tr q-down"><use href="#t-down"/></svg><span class="ltr">−5</span> اضطراب</span>
        </button>
        <button class="q-act tap">
          <span class="q-ai"><svg class="i"><use href="#i-shield"/></svg></span>
          <span class="q-an">تعزيز الأمن</span>
          <span class="q-ac"><span class="ltr">0.2</span> مليار $ / سنة</span>
          <span class="q-ae q-good"><svg class="q-tr q-down"><use href="#t-down"/></svg><span class="ltr">−8</span> اضطراب <span class="q-bad"><span class="ltr">−3</span> شرعية</span></span>
        </button>
      </div>
    </div>
  </section>
