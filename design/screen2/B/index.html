<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>القائمة الرئيسية B</title>
<script>
  /* Device frame from the URL (points): ?w=844&h=390&side=47&bottom=21&cutout=notch|island|none
     Optional: &hit=1 draws the 44 pt hit boxes and the safe area.
     Same responsive system as the approved play screen (screen1/B3). */
  (function () {
    var q = new URLSearchParams(location.search);
    function n(k, d) { var v = parseFloat(q.get(k)); return isFinite(v) ? v : d; }
    var W = n('w', 844), H = n('h', 390), SIDE = n('side', 47), BOTTOM = n('bottom', 21);
    var CUT = q.get('cutout') || 'notch';
    if (['notch', 'island', 'none'].indexOf(CUT) < 0) CUT = 'none';
    var r = document.documentElement, s = r.style;
    s.setProperty('--w', W + 'px');
    s.setProperty('--h', H + 'px');
    s.setProperty('--side', SIDE + 'px');
    s.setProperty('--bottom', BOTTOM + 'px');
    s.setProperty('--corner', (CUT === 'none' ? 0 : 39) + 'px');
    r.dataset.cutout = CUT;
    r.dataset.home = BOTTOM > 0 ? 'yes' : 'no';
    if (q.get('hit') === '1') r.classList.add('show-hit');
    window.__dev = { W: W, H: H, SIDE: SIDE, BOTTOM: BOTTOM, CUT: CUT };
  })();
</script>
<style>
  :root {
    /* device (overwritten from the URL) */
    --w: 844px; --h: 390px; --side: 47px; --bottom: 21px; --corner: 39px;
    /* safe layout box: never inside the side insets; the action row's 44 pt hit boxes end
       exactly at the home indicator inset (36 pt button + 4 pt hit overhang) */
    --gutter: max(var(--side), 8px);
    --top-gap: 8px;
    --bar-gap: max(calc(var(--bottom) + 4px), 8px);

    /* ===== the approved slim system (screen1/B3) ===== */
    --ctl: 32px;  --row: 36px;  --big: 44px;      /* the only control heights */
    --r-bar: 12px;  --r-ctl: 10px;                 /* cards / controls */
    --pad-bar: 12px;  --pad-ctl: 10px;
    --s1: 4px; --s2: 8px; --s3: 12px;               /* spacing scale */
    --fs-label: 10px;   --lh-label: 12px;
    --fs-sec: 11.5px;   --lh-sec: 14px;
    --fs-val: 13px;     --lh-val: 16px;            /* semibold, tabular */
    --fs-name: 14px;    --lh-name: 17px;           /* bold */
    --fs-display: 36px; --lh-display: 46px;        /* the wordmark only */
    --ico: 16px;

    --glass: rgba(9, 17, 25, 0.66);
    --stroke: rgba(127, 233, 255, 0.14);
    --hair: rgba(127, 233, 255, 0.13);
    --t1: #EAF2F7;
    --t2: #A9BCCB;
    --cyan: #7FE9FF;
    --teal: #3FE0D0;
    --ink: #060B10;                                  /* shade colour of the room vignette */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    position: relative;
    background: #0B1218;
    color: var(--t1);
    font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    line-height: 1;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: inherit; }
  svg.i { width: var(--ico); height: var(--ico); fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
  .ltr { direction: ltr; unicode-bidi: isolate; }

  /* ---------- Touch targets: invisible ::before box of at least 44 x 44 pt (as screen1) ---------- */
  .tap { position: relative; }
  .tap::before {
    content: ""; position: absolute;
    left: calc(50% + var(--hx, 0px)); top: calc(50% + var(--hy, 0px));
    width: max(100%, 44px); height: max(100%, 44px);
    transform: translate(-50%, -50%);
  }
  .glass.tap::before { width: max(100% + 2px, 44px); height: max(100% + 2px, 44px); }
  .show-hit .tap::before { outline: 1px solid rgba(255, 60, 160, 0.9); background: rgba(255, 60, 160, 0.12); z-index: 5; }

  /* ---------- The room: photo (cover) + a soft vignette that keeps it recognisable ---------- */
  .scene { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); overflow: hidden; }
  .scene .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }
  .shade { position: absolute; inset: 0; pointer-events: none;
    background:
      /* soft dark pool behind the wordmark (upper third, centred) */
      radial-gradient(ellipse 34% 30% at 50% 25%, rgba(6, 11, 16, 0.80) 0%, rgba(6, 11, 16, 0.70) 40%, rgba(6, 11, 16, 0.30) 75%, rgba(6, 11, 16, 0) 100%),
      /* floor shade under the action row */
      linear-gradient(to top, rgba(6, 11, 16, 0.70) 0%, rgba(6, 11, 16, 0.38) 22%, rgba(6, 11, 16, 0) 46%),
      /* lens vignette at the edges */
      radial-gradient(ellipse 80% 90% at 50% 45%, rgba(6, 11, 16, 0) 55%, rgba(6, 11, 16, 0.50) 100%),
      /* overall dim, so the bright wall sits back */
      linear-gradient(rgba(6, 11, 16, 0.16), rgba(6, 11, 16, 0.16));
  }

  /* ---------- Glass: one look for every panel (as screen1) ---------- */
  .glass {
    position: relative;
    isolation: isolate;
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(1.1);
    backdrop-filter: blur(18px) saturate(1.1);
    border: 1px solid var(--stroke);
    border-radius: var(--r);
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.26);
  }
  .card { --r: var(--r-bar); }
  .ctl { --r: var(--r-ctl); }
  /* render-side frost (see frost() below): a blurred copy of the room + the same 0.66 tint */
  .frost { position: absolute; inset: 0; z-index: -1; overflow: hidden; border-radius: calc(var(--r) - 1px); pointer-events: none; background: #0B1218; }
  .frost i { position: absolute; display: block; filter: blur(18px) saturate(1.1); }
  .frost i img { position: absolute; display: block; }
  .frost i b { position: absolute; display: block; }
  .frost::after { content: ""; position: absolute; inset: 0; background: var(--glass); }
  .frosted .glass { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }

  /* ---------- Menu box = safe area ---------- */
  .ui {
    position: absolute;
    top: var(--top-gap);
    bottom: var(--bar-gap);
    left: var(--gutter);
    right: var(--gutter);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* free space: a little less above the wordmark than between the blocks, so the title sits in the upper third */
  .sp { flex: 1 1 0; min-height: 0; }
  .sp.a { flex-grow: 0.8; }
  .sp.b { flex-grow: 1; }
  .sp.c { flex-grow: 1.1; }

  /* Version: tiny, top-right corner, where the room is darkest (the bright wall map fills the top-left) */
  .ver { position: absolute; top: 0; right: 0; font-size: var(--fs-label); font-weight: 500; line-height: var(--lh-label); color: var(--t2); white-space: nowrap; }

  /* Wordmark + subtitle */
  .brand { flex: none; display: flex; flex-direction: column; align-items: center; gap: var(--s1); text-align: center; }
  .wordmark { font-size: var(--fs-display); font-weight: 700; line-height: var(--lh-display); color: var(--t1); white-space: nowrap;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55); }
  .sub { display: flex; align-items: center; gap: var(--s2); }
  .sub span { font-size: var(--fs-sec); font-weight: 500; line-height: var(--lh-sec); color: var(--t2); white-space: nowrap; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); }
  .rule { flex: none; width: 28px; height: 1px; display: block; }
  .rule.r { background: linear-gradient(to left, rgba(127, 233, 255, 0), rgba(127, 233, 255, 0.55)); }   /* right of the text, fades outward */
  .rule.l { background: linear-gradient(to right, rgba(127, 233, 255, 0), rgba(127, 233, 255, 0.55)); }

  /* ---------- Continue card: last save + the primary action ---------- */
  .continue { flex: none; display: flex; align-items: center; gap: var(--s3);
    padding-block: var(--s2); padding-inline: var(--pad-bar) var(--s2); }   /* RTL: 12 at the flag side, 8 around the 44 pt action */
  .save { flex: 1 1 auto; display: flex; align-items: center; gap: var(--s3); min-width: 0; }
  .flag { width: 32px; height: 24px; border-radius: 3px; overflow: hidden; flex: none; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.22); }
  .flag img { width: 100%; height: 100%; display: block; }
  .stext { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s1); }
  .l1 { display: flex; align-items: baseline; gap: var(--s1); white-space: nowrap; }
  .dot { font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); color: var(--t2); }
  .nm { font-size: var(--fs-name); font-weight: 700; line-height: var(--lh-name); color: var(--t1); }
  .dt { font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); color: var(--t1); }
  .l2 { font-size: var(--fs-sec); font-weight: 500; line-height: var(--lh-sec); color: var(--t2); white-space: nowrap; }
  .cta { --r: var(--r-ctl); flex: none; height: var(--big); min-width: 120px; padding-inline: var(--pad-bar);
    display: flex; align-items: center; justify-content: center; gap: var(--s2);
    border-radius: var(--r); color: var(--cyan);
    background: linear-gradient(180deg, rgba(127, 233, 255, 0.20), rgba(127, 233, 255, 0.11));
    box-shadow: inset 0 0 0 1px rgba(127, 233, 255, 0.34); }
  .cta span { font-size: var(--fs-name); font-weight: 700; line-height: var(--lh-name); white-space: nowrap; }
  .cta svg.i { fill: currentColor; }

  /* ---------- Bottom action row: four equal 36 pt glass buttons ---------- */
  .actions { flex: none; max-width: 100%; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--s2); }
  .act { height: var(--row); min-width: 0; display: flex; align-items: center; justify-content: center; gap: var(--s2); padding-inline: var(--pad-bar);
    font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); color: var(--t1); white-space: nowrap; }
  .act svg.i { color: var(--t2); }
  /* Fit levels (set by fitActions() from measurement, not from the device name):
     0: 13 pt labels   1: 11.5 pt labels (the screen1 button size)   2: and 10 pt side padding   3: and 4 pt icon gap */
  [data-fit="1"] .act, [data-fit="2"] .act, [data-fit="3"] .act { font-size: var(--fs-sec); line-height: var(--lh-sec); }
  [data-fit="2"] .act, [data-fit="3"] .act { padding-inline: var(--pad-ctl); }
  [data-fit="3"] .act { gap: var(--s1); }

  /* ---------- Device overlay (as screen1) ---------- */
  .dev { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
  .corners { position: absolute; inset: 0; border-radius: var(--corner); box-shadow: 0 0 0 60px #000; }
  .cutout { position: absolute; background: #000; display: none; }
  [data-cutout="island"] .cutout { display: block; left: 11px; top: calc(50% - 63px); width: 37px; height: 126px; border-radius: 18.5px; }
  [data-cutout="notch"] .cutout { display: block; left: 0; top: calc(50% - 105px); width: 30px; height: 210px; border-radius: 0 20px 20px 0; }
  .homebar { position: absolute; display: none; left: calc(50% - 67px); bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.55); }
  [data-home="yes"] .homebar { display: block; }
  .show-hit .safe { position: absolute; top: 0; bottom: var(--bottom); left: var(--side); right: var(--side); outline: 1px dashed rgba(255, 255, 0, 0.8); }
</style>
</head>
<body>

<!-- SVG symbol library (24 grid, round stroke 1.75, drawn at 16 pt) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a.8.8 0 0 0 1.2.7l10.3-6.4a.8.8 0 0 0 0-1.4L9.2 4.9A.8.8 0 0 0 8 5.6z"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.75"/><path d="M12 8.25v7.5M8.25 12h7.5"/></symbol>
    <symbol id="i-load" viewBox="0 0 24 24"><path d="M3.5 7.25a2 2 0 0 1 2-2h3.9l2 2.25h7.1a2 2 0 0 1 2 2v7.25a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M12 10.75v5M9.75 13.75 12 16l2.25-2.25"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.9"/><path d="M10.6 3.5h2.8l.5 2.3a6.6 6.6 0 0 1 1.7 1l2.2-.8 1.4 2.4-1.7 1.6a6.6 6.6 0 0 1 0 2l1.7 1.6-1.4 2.4-2.2-.8a6.6 6.6 0 0 1-1.7 1l-.5 2.3h-2.8l-.5-2.3a6.6 6.6 0 0 1-1.7-1l-2.2.8-1.4-2.4 1.7-1.6a6.6 6.6 0 0 1 0-2L4.6 8.4 6 6l2.2.8a6.6 6.6 0 0 1 1.7-1z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.75C10.2 5.5 7.7 4.75 4.5 4.75v13c3.2 0 5.7.75 7.5 2 1.8-1.25 4.3-2 7.5-2v-13c-3.2 0-5.7.75-7.5 2z"/><path d="M12 6.75v13"/></symbol>
  </defs>
</svg>

<!-- The room: approved background, cover, plus a soft vignette -->
<div class="scene" aria-hidden="true">
  <img class="bg" src="../../shared/menu_background.png" alt="">
  <div class="shade"></div>
</div>

<main class="ui">
  <span class="ver">الإصدار <span class="ltr">0.1</span></span>

  <span class="sp a"></span>

  <header class="brand">
    <h1 class="wordmark">صانع التاريخ</h1>
    <p class="sub"><i class="rule r"></i><span>استراتيجية عالمية · من 2011 إلى 2100</span><i class="rule l"></i></p>
  </header>

  <span class="sp b"></span>

  <!-- Primary: continue the last save. The whole card is one button. -->
  <button class="continue glass card tap" aria-label="متابعة: مصر، 14 مارس 2011، حفظ تلقائي قبل 3 دقائق">
    <span class="save">
      <span class="flag"><img src="../../shared/flag_eg.svg" alt="علم مصر"></span>
      <span class="stext">
        <span class="l1"><b class="nm">مصر</b><span class="dot">·</span><span class="dt">14 مارس 2011</span></span>
        <span class="l2">حفظ تلقائي · قبل 3 دقائق</span>
      </span>
    </span>
    <span class="cta"><svg class="i"><use href="#i-play"/></svg><span>متابعة</span></span>
  </button>

  <span class="sp c"></span>

  <!-- The other four actions: one row of equal 36 pt glass buttons above the home indicator -->
  <nav class="actions" aria-label="القائمة">
    <button class="act glass ctl tap"><svg class="i"><use href="#i-new"/></svg><span>لعبة جديدة</span></button>
    <button class="act glass ctl tap"><svg class="i"><use href="#i-load"/></svg><span>تحميل لعبة</span></button>
    <button class="act glass ctl tap"><svg class="i"><use href="#i-gear"/></svg><span>الإعدادات</span></button>
    <button class="act glass ctl tap"><svg class="i"><use href="#i-book"/></svg><span>المصادر وحقوق البيانات</span></button>
  </nav>
</main>

<!-- Device silhouette drawn on top: rounded corners, camera cutout, home indicator -->
<div class="dev" aria-hidden="true">
  <div class="corners"></div>
  <div class="cutout"></div>
  <div class="homebar"></div>
  <div class="safe"></div>
</div>

<script>
  /* Step the action row down until all four equal buttons fit the safe width with their full labels. */
  /* icon + gap + label + side padding: what a button needs to show its whole label (the hit-box
     ::before and the frost layer are absolutely positioned, so scrollWidth would count them) */
  function contentWidth(a) {
    var cs = getComputedStyle(a), w = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight), n = 0;
    Array.prototype.forEach.call(a.children, function (c) {
      if (c.classList.contains('frost') || getComputedStyle(c).display === 'none') return;
      w += c.getBoundingClientRect().width; n++;
    });
    return w + Math.max(0, n - 1) * parseFloat(cs.columnGap || 0);
  }
  function innerWidthOf(a) {   /* unrounded padding-box width (clientWidth is rounded to whole points) */
    var cs = getComputedStyle(a);
    return a.getBoundingClientRect().width - parseFloat(cs.borderLeftWidth) - parseFloat(cs.borderRightWidth);
  }
  window.__actClip = function (a) { return contentWidth(a) - innerWidthOf(a); };
  function fitActions() {
    var root = document.documentElement, ui = document.querySelector('.ui'), row = document.querySelector('.actions');
    var acts = Array.prototype.slice.call(row.querySelectorAll('.act'));
    for (var lv = 0; lv <= 3; lv++) {
      root.dataset.fit = String(lv);
      row.style.maxWidth = 'none';
      var need = row.getBoundingClientRect().width;
      var clipped = acts.some(function (a) { return contentWidth(a) > innerWidthOf(a) + 0.05; });
      if (need <= ui.clientWidth + 0.01 && !clipped) break;
    }
    row.style.maxWidth = '';
    window.__fit = { level: +root.dataset.fit, need: need, avail: ui.clientWidth };
  }

  /* The continue card spans the two middle buttons of the action row when its content allows,
     so the card and the row share one column grid. */
  function alignCard() {
    var acts = document.querySelectorAll('.act'), card = document.querySelector('.continue');
    var span = acts[1].getBoundingClientRect().right - acts[2].getBoundingClientRect().left;   /* RTL: [1] is right-middle, [2] left-middle */
    card.style.width = '';
    var natural = card.getBoundingClientRect().width;
    if (span >= natural) card.style.width = span + 'px';
    window.__card = { natural: natural, span: span, aligned: span >= natural };
  }

  /* Frosted glass for the mockup render (as screen1): headless Chromium leaves a sharp copy of
     image content under backdrop-filter, so each panel gets its own clipped copy of the room,
     blurred with filter: blur(), under the same 0.66 tint. backdrop-filter stays as the fallback. */
  function frost() {
    var bg = document.querySelector('.scene .bg');
    var W = window.__dev.W, H = window.__dev.H, NW = bg.naturalWidth || 1672, NH = bg.naturalHeight || 941;
    var k = Math.max(W / NW, H / NH), iw = NW * k, ih = NH * k, ix = (W - iw) / 2, iy = (H - ih) / 2;   /* object-fit: cover, 50% 50% */
    var shade = getComputedStyle(document.querySelector('.shade')).backgroundImage;
    Array.prototype.forEach.call(document.querySelectorAll('.ui .glass'), function (g) {
      var f = g.querySelector(':scope > .frost');
      if (!f) {
        f = document.createElement('span'); f.className = 'frost'; f.setAttribute('aria-hidden', 'true');
        var i = document.createElement('i'), im = document.createElement('img'), b = document.createElement('b');
        im.src = bg.src; i.appendChild(im); i.appendChild(b); f.appendChild(i);
        g.insertBefore(f, g.firstChild);
      }
      var r = g.getBoundingClientRect(), cs = getComputedStyle(g), i = f.firstChild;
      var ox = -r.left - parseFloat(cs.borderLeftWidth), oy = -r.top - parseFloat(cs.borderTopWidth);
      i.style.left = ox + 'px'; i.style.top = oy + 'px'; i.style.width = W + 'px'; i.style.height = H + 'px';
      var im2 = i.querySelector('img'), b2 = i.querySelector('b');
      im2.style.left = ix + 'px'; im2.style.top = iy + 'px'; im2.style.width = iw + 'px'; im2.style.height = ih + 'px';
      b2.style.left = '0px'; b2.style.top = '0px'; b2.style.width = W + 'px'; b2.style.height = H + 'px'; b2.style.backgroundImage = shade;
    });
    document.documentElement.classList.add('frosted');
  }

  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
    .then(fitActions).then(alignCard).then(frost).then(function () { window.__ready = true; });
</script>
</body>
</html>
