<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الخريطة العسكرية</title>
<script>
  /* Device frame from the URL (points): ?w=844&h=390&side=47&bottom=21&cutout=notch|island|none
     Optional: &speedmenu=1 renders the speed menu open, &hit=1 draws the 44 pt hit boxes,
     &state=order|idle, &t=0..1 (a frozen share of the march; without it the clock runs), &loop=0, &motion=reduce:
     the military map of screen 14 (D-15).
     Everything below is laid out with flexbox from these CSS variables; nothing is tied to 844x390. */
  (function () {
    var q = new URLSearchParams(location.search);
    function n(k, d) { var v = parseFloat(q.get(k)); return isFinite(v) ? v : d; }
    var W = n('w', 844), H = n('h', 390), SIDE = n('side', 47), BOTTOM = n('bottom', 21);
    var CUT = q.get('cutout') || 'notch';
    if (['notch', 'island', 'none'].indexOf(CUT) < 0) CUT = 'none';
    var r = document.documentElement, s = r.style;
    s.setProperty('--w', W + 'px');
    s.setProperty('--h', H + 'px');
    s.setProperty('--side', SIDE + 'px');
    s.setProperty('--bottom', BOTTOM + 'px');
    s.setProperty('--map-s', String(0.63 * H / 390));          /* map scales with the screen height */
    s.setProperty('--corner', (CUT === 'none' ? 0 : 39) + 'px');
    r.dataset.cutout = CUT;
    r.dataset.home = BOTTOM > 0 ? 'yes' : 'no';
    if (q.get('hit') === '1') r.classList.add('show-hit');
    if (q.get('speedmenu') === '1') r.classList.add('menu-open');
    window.__dev = { W: W, H: H, SIDE: SIDE, BOTTOM: BOTTOM, CUT: CUT };
  })();
</script>
<style>
  :root {
    /* device (overwritten from the URL) */
    --w: 844px; --h: 390px; --side: 47px; --bottom: 21px; --map-s: 0.63; --corner: 39px;
    /* safe layout box: never inside the side insets; the dock sits just above the home indicator */
    --gutter: max(var(--side), 8px);
    --top-gap: 8px;
    --dock-gap: max(calc(var(--bottom) + 1px), 8px);
    --map-cx: calc(var(--w) * 0.56);
    --map-cy: calc(var(--h) * 0.5);

    /* ===== Uniform slim system: the only sizes used below ===== */
    --row: 36px;        /* every top-row element: nation card, indicator strip, date/speed pill */
    --ctl: 32px;        /* every small control: toast, map mode, my country, speed buttons, menu rows */
    --dock-h: 44px;     /* section dock */
    --r-bar: 12px;      /* radius of 36 pt elements, the dock and the menu panel */
    --r-ctl: 10px;      /* radius of 32 pt controls */
    --pad-bar: 12px;    /* inner horizontal padding of bars */
    --pad-ctl: 10px;    /* inner horizontal padding of controls */
    --s1: 4px; --s2: 8px; --s3: 12px;               /* spacing scale */
    --fs-label: 10px;   --lh-label: 12px;           /* labels */
    --fs-sec: 11.5px;   --lh-sec: 14px;             /* secondary */
    --fs-val: 13px;     --lh-val: 16px;             /* values: semibold, tabular */
    --fs-name: 14px;    --lh-name: 17px;            /* country name: bold */
    --ico: 16px; --ico-stat: 14px; --ico-dock: 17px; --glyph: 10px;

    /* one glass, one border */
    --glass: rgba(9, 17, 25, 0.66);
    --stroke: rgba(127, 233, 255, 0.14);
    --hair: rgba(127, 233, 255, 0.13);
    --t1: #EAF2F7;
    --t2: #A9BCCB;
    --t3: #A2B6C6;
    --cyan: #7FE9FF;
    --teal: #3FE0D0;
    --amber: #F2B14C;
    --red: #F2705A;
    --blue: #6FB6FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    position: relative;
    background: #0B1218;
    color: var(--t1);
    font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    line-height: 1;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  svg.i { width: var(--ico); height: var(--ico); fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
  .ltr { direction: ltr; unicode-bidi: isolate; }

  /* ---------- Touch targets ----------
     Every tappable control (.tap) carries an invisible ::before hit box of at least 44 x 44 pt.
     It is centred on the control and can be nudged with --hx / --hy toward free space, so that
     32 pt controls stacked 8 pt apart (40 pt pitch) still get 44 pt boxes that never overlap:
     toast -2, map mode +2, my country +6 (each box borders the next one exactly). */
  .tap { position: relative; }
  .tap::before {
    content: ""; position: absolute;
    left: calc(50% + var(--hx, 0px)); top: calc(50% + var(--hy, 0px));
    width: max(100%, 44px); height: max(100%, 44px);
    transform: translate(-50%, -50%);
  }
  /* glass buttons: 100% is the padding box, so add the 1 px border on each side to cover the whole control */
  .glass.tap::before { width: max(100% + 2px, 44px); height: max(100% + 2px, 44px); }
  .show-hit .tap::before { outline: 1px solid rgba(255, 60, 160, 0.9); background: rgba(255, 60, 160, 0.12); z-index: 5; }

  /* ---------- Map: full-bleed under the insets, two aligned layers ---------- */
  .map {
    position: absolute;
    width: calc(1688px * var(--map-s));
    height: calc(1097px * var(--map-s));
    /* Egypt's bounding-box centre in the image is (764, 578) */
    left: calc(var(--map-cx) - 764px * var(--map-s));
    top: calc(var(--map-cy) - 578px * var(--map-s));
  }
  .map img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Glass: one look for every panel ---------- */
  .glass {
    position: relative;
    isolation: isolate;
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(1.1);
    backdrop-filter: blur(18px) saturate(1.1);
    border: 1px solid var(--stroke);
    border-radius: var(--r);
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.26);
  }
  .bar { --r: var(--r-bar); }
  .ctl { --r: var(--r-ctl); }
  /* render-side frost (see frost() below): blurred map copy + the same 0.66 tint */
  .frost { position: absolute; inset: 0; z-index: -1; overflow: hidden; border-radius: calc(var(--r) - 1px); pointer-events: none; }
  .frost i { position: absolute; display: block;
    background: url("../../shared/map_mena_d1_overlay.svg") 0 0 / 100% 100% no-repeat, url("../../shared/map_mena_d1.jpg") 0 0 / 100% 100% no-repeat;
    filter: blur(18px) saturate(1.1); }
  .frost::after { content: ""; position: absolute; inset: 0; background: var(--glass); }
  .frosted .glass { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }

  /* ---------- HUD box = safe area ---------- */
  .hud {
    position: absolute;
    top: var(--top-gap);
    bottom: var(--dock-gap);
    left: var(--gutter);
    right: var(--gutter);
    display: flex;
    flex-direction: column;
    pointer-events: none;          /* the map stays pannable between panels */
  }
  .hud .glass { pointer-events: auto; }

  /* ---------- Top row: three 36 pt elements, all at 8 pt from the top ---------- */
  .top { flex: none; height: var(--row); display: flex; align-items: stretch; gap: var(--s2); }

  /* Nation card: top-right */
  .nation { flex: none; display: flex; align-items: center; gap: var(--s2); padding-inline: var(--pad-bar); text-align: right; }
  .flag { width: 22px; height: 16.5px; border-radius: 3px; overflow: hidden; flex: none; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.22); }
  .flag img { width: 100%; height: 100%; display: block; }
  /* Name over "leader · regime" (fit 0). A grid, so the narrower fit 1 can re-flow the same three
     items into "name  leader" over "regime" without hiding any of them. */
  .ntext { display: grid; grid-template-columns: auto auto; grid-template-areas: "nm nm" "ldr rg"; justify-content: start; align-items: baseline; }
  .ntext .nm { grid-area: nm; font-size: var(--fs-name); font-weight: 700; line-height: var(--lh-name); color: var(--t1); }
  .ntext .ldr, .ntext .rg { font-size: var(--fs-label); font-weight: 500; line-height: var(--lh-label); color: var(--t2); white-space: nowrap; }
  .ntext .ldr { grid-area: ldr; }
  .ntext .rg { grid-area: rg; }
  .ntext .rg::before { content: "\00a0·\00a0"; }

  /* Indicator strip: top-centre, content-sized (extra width on wide screens stays map) */
  .stats { flex: none; margin-inline: auto; display: flex; align-items: stretch; padding-inline: var(--s2); }
  /* 4 pt on each side of an indicator = 8 pt between indicators, 8 + 4 = 12 pt at the strip ends */
  .stat { flex: none; min-width: 44px; display: flex; align-items: center; justify-content: center; padding-inline: var(--s1); }
  .stat + .stat::after { content: ""; position: absolute; right: 0; top: 9px; bottom: 9px; width: 1px; background: var(--hair); }
  .stat-in { display: flex; flex-direction: column; align-items: flex-start; }
  .lblrow { display: flex; align-items: center; gap: var(--s1); height: var(--lh-label); }
  .lbl { font-size: var(--fs-label); font-weight: 500; line-height: var(--lh-label); color: var(--t2); white-space: nowrap; }
  .trend { width: var(--glyph); height: var(--glyph); fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
  .trend.down { color: var(--amber); }
  .trend.up { color: var(--blue); }
  .trend.flat { color: var(--t2); }
  .valrow { display: flex; align-items: center; gap: var(--s1); height: var(--lh-val); white-space: nowrap; }
  .valrow svg.i { width: var(--ico-stat); height: var(--ico-stat); color: var(--t2); }
  .num { font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); color: var(--t1); }
  .unit { font-size: var(--fs-label); font-weight: 500; line-height: var(--lh-val); color: var(--t2); }   /* unit follows its value after a word space */

  /* Date + speed pill: top-left. RTL: date text on the right, the speed control at the left end. */
  .date { flex: none; display: flex; align-items: center; gap: var(--s1); padding-inline: var(--pad-bar) 1px; }
  .dtext { display: flex; flex-direction: column; }
  .dow { font-size: var(--fs-label); font-weight: 500; line-height: var(--lh-label); color: var(--t2); }
  .dmy { font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); color: var(--t1); white-space: nowrap; }
  /* The single speed control: a plain play/pause icon button + the speed chip, both 32 pt, sitting
     2 pt inside the 36 pt pill (12 pt pill radius - 2 pt inset = 10 pt chip radius, concentric).
     The 4 pt gap to the date text reads as 12 pt to the pause glyph (centred in its 32 pt box). */
  .cap { --r: var(--r-ctl); flex: none; height: var(--ctl); display: flex; border-radius: var(--r); }
  .cap > button { height: 100%; display: grid; place-items: center; }
  .play { width: 32px; color: var(--t1); --hx: 6px; }           /* hit box grows toward the date text, not into the speed chip */
  .play svg.i { fill: currentColor; }
  .spd { width: 44px; color: var(--cyan); font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); border-radius: var(--r-ctl);
    background: rgba(127, 233, 255, 0.10); box-shadow: inset 0 0 0 1px rgba(127, 233, 255, 0.16); }
  .menu-open .spd { background: rgba(127, 233, 255, 0.20); box-shadow: inset 0 0 0 1px rgba(127, 233, 255, 0.40); }

  /* Speed menu: popover directly under the pill. Rows are 32 pt (radius 10) on a 44 pt pitch,
     so each row keeps its own 44 x 44 pt hit box. */
  .menu { --r: var(--r-bar); position: absolute; left: 0; top: calc(var(--row) + var(--s2)); z-index: 10;
    display: none; flex-direction: column; gap: var(--s3); padding: var(--s1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }            /* popover sits one level above the other glass */
  .menu-open .menu { display: flex; }
  .mrow { --r: var(--r-ctl); height: var(--ctl); display: flex; align-items: center; gap: var(--s2); padding-inline: var(--pad-ctl);
    border-radius: var(--r); font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); color: var(--t1); white-space: nowrap; }
  .mrow .chk { color: var(--cyan); visibility: hidden; }
  .mrow.on { color: var(--cyan); background: rgba(127, 233, 255, 0.12); }
  .mrow.on .chk { visibility: visible; }
  /* إيقاف | speeds. A class, not :first-child: frost() inserts its .frost layer as the first child of every panel. */
  .mrow.stop::after { content: ""; position: absolute; left: var(--pad-ctl); right: var(--pad-ctl); bottom: -6.5px; height: 1px; background: var(--hair); }

  /* ---------- Left stack: right under the top row ---------- */
  .mid { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: flex-end; /* = left in RTL */ padding-top: var(--s3); }
  .lstack { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: var(--s2); }

  /* Notification toast: preview + bell (bell on the outer edge) */
  .toast { height: var(--ctl); display: flex; align-items: stretch; }
  .toast .tap { --hy: -2px; }
  .alert-prev { display: flex; align-items: center; gap: var(--s2); padding-inline: var(--pad-ctl); }
  .alert-prev svg.i { color: var(--amber); }
  .alert-prev .txt { font-size: var(--fs-sec); font-weight: 500; line-height: var(--lh-sec); color: var(--t1); white-space: nowrap; }
  .alert-prev::after { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: var(--hair); }
  .bell { width: 44px; display: grid; place-items: center; color: var(--t1); }
  .badge { position: absolute; top: -4px; left: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #0B1218;
    font-size: var(--fs-label); font-weight: 700; line-height: 16px; text-align: center; box-shadow: 0 0 0 2px rgba(9, 17, 25, 0.9); }

  /* Map controls */
  .btn { height: var(--ctl); display: flex; align-items: center; gap: var(--s2); padding-inline: var(--pad-ctl);
    font-size: var(--fs-sec); font-weight: 600; line-height: var(--lh-sec); color: var(--t1); white-space: nowrap; }
  .btn svg.i { color: var(--t2); }
  .btn .k { color: var(--t3); font-weight: 500; }
  .btn.mode { --hy: 2px; }
  .btn.home { --hy: 6px; }
  .btn.home svg.i { color: var(--teal); }

  /* ---------- Bottom dock (just above the home indicator) ---------- */
  .dock { flex: none; align-self: center; height: var(--dock-h); display: flex; padding-inline: var(--s2); }
  .dock-item { min-width: 44px; padding-inline: var(--s1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s1); color: var(--t2); }
  .dock-item svg.i { width: var(--ico-dock); height: var(--ico-dock); color: var(--t1); opacity: 0.92; }
  .dock-item span { font-size: var(--fs-label); font-weight: 500; line-height: var(--lh-label); white-space: nowrap; }
  /* The two end items hug their label, so the dock reads 12 pt (8 + 4) from its edge to the outer
     label, like every other bar. Their 44 pt hit box grows outward (past the dock edge), never into
     the neighbour. RTL: the first item is the right end, the last item the left end.
     (Classes, not :first-child: frost() inserts a .frost layer as the first child of the dock.) */
  .dock-item.end { min-width: 0; }
  .dock-item.end-r { --hx: max(0px, (44px - 100%) / 2); }
  .dock-item.end-l { --hx: min(0px, (100% - 44px) / 2); }

  /* ---------- Fit levels (set by fitTop() from the measured top row, not from the device name) ----------
     Only the nation card condenses; every other element keeps the same tokens on every device.
     0: flag, name over "leader · regime"
     1: flag, "name  leader" over "regime": same content, same type, about 36 pt narrower
     2: flag and name                   3: flag only (the map already labels Egypt) */
  [data-fit="1"] .ntext { grid-template-areas: "nm ldr" "rg rg"; column-gap: var(--s2); }
  [data-fit="1"] .ntext .rg::before { content: none; }
  [data-fit="2"] .ntext { grid-template-columns: auto; grid-template-areas: "nm"; }
  [data-fit="2"] .ntext .ldr, [data-fit="2"] .ntext .rg { display: none; }
  [data-fit="3"] .ntext { display: none; }

  /* ---------- Device overlay (on top of the render, for the fit check) ---------- */
  .dev { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
  .corners { position: absolute; inset: 0; border-radius: var(--corner); box-shadow: 0 0 0 60px #000; }
  .cutout { position: absolute; background: #000; display: none; }
  [data-cutout="island"] .cutout { display: block; left: 11px; top: calc(50% - 63px); width: 37px; height: 126px; border-radius: 18.5px; }
  [data-cutout="notch"] .cutout { display: block; left: 0; top: calc(50% - 105px); width: 30px; height: 210px; border-radius: 0 20px 20px 0; }
  .homebar { position: absolute; display: none; left: calc(50% - 67px); bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.55); }
  [data-home="yes"] .homebar { display: block; }
  .show-hit .safe { position: absolute; top: 0; bottom: var(--bottom); left: var(--side); right: var(--side); outline: 1px dashed rgba(255, 255, 0, 0.8); }
</style>
<style>/* D-3 (confirmed): opaque panels, applied to the HUD exactly as ../../proposals/D3_panels/opaque.html */
  .glass { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  .frost i { display: none !important; }
  .frost::after { background: rgb(12, 20, 28) !important; }
</style>
<style>
  /* ================= Screen 4, variant A: the province panel as a tabbed side sheet =================
     Right side sheet (RTL start), width clamp(42% of the safe width, 340, 440) pt, from 8 pt under the
     top row down to 8 pt above the section dock. The whole HUD (top row, left stack, dock) keeps the
     exact place and size it has on the play screen B3; nothing in the HUD moves or hides.
     Top part fixed: header, status, the 3 headline numbers. Then a 32 pt segmented tab row that shows one
     group of details at a time (السياسة / المجتمع / الاقتصاد / الأمن), and the action card pinned at the
     bottom of the sheet. The card shows as many whole 44 pt action rows as fit and scrolls the rest
     inside itself (17 Pro Max: 2 of 3, SE: 1 of 3); the details above it never scroll.
     Fit levels, measured by fitSheet() (not by device name), each step only to show more whole action rows:
       0: every gap 8 pt
       1: header -> status -> numbers 4 pt
       2: also tab row -> details -> actions 4 pt (long status values on the 17 Pro Max)
       3: also the sheet's top and bottom padding 4 pt
       4: also the header on one 32 pt line (name, capital chip, flag and country) and the detail rows
          without a gap (16 pt line pitch); only where nothing else shows a whole action row
     The numbers -> tab row gap stays 8 pt at every level: the 44 pt hit boxes of both need it. */
  :root { --title: 18px; --lh-title: 22px; --sheet-w: 340px; --sheet-b: 0px; --g-blk: var(--s2); --g-det: var(--s2); --pad-sh: var(--s2); }
  [data-sheetfit="1"] { --g-blk: var(--s1); }
  [data-sheetfit="2"] { --g-blk: var(--s1); --g-det: var(--s1); }
  [data-sheetfit="3"], [data-sheetfit="4"] { --g-blk: var(--s1); --g-det: var(--s1); --pad-sh: var(--s1); }
  [data-sheetfit="4"] .sh-head { height: var(--ctl); }
  [data-sheetfit="4"] .ttl { flex-direction: row; align-items: center; gap: var(--s2); }
  [data-sheetfit="4"] .pane { gap: 0; }

  .sheet { --r: var(--r-bar); position: absolute; right: 0; top: calc(var(--row) + var(--s2)); bottom: var(--sheet-b); width: var(--sheet-w);
    display: flex; flex-direction: column; padding: var(--pad-sh) var(--pad-bar); z-index: 2; }

  /* header: name + capital chip, the country line under it, close at the RTL end */
  .sh-head { flex: none; height: 36px; display: flex; align-items: center; gap: var(--s2); }
  .ttl { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .nmrow { height: var(--lh-title); display: flex; align-items: center; gap: var(--s2); }
  .pname { font-size: var(--title); font-weight: 700; line-height: var(--lh-title); color: var(--t1); white-space: nowrap; }
  .capital { height: 20px; display: flex; align-items: center; gap: var(--s1); padding-inline: var(--s1) var(--s2); border-radius: 10px;
    background: rgba(127, 233, 255, 0.08); box-shadow: inset 0 0 0 1px rgba(127, 233, 255, 0.28); }
  .capital svg.i { color: var(--cyan); }
  .capital span { font-size: var(--fs-label); font-weight: 700; line-height: var(--lh-label); color: var(--t1); white-space: nowrap; }
  .ctry { height: var(--lh-sec); display: flex; align-items: center; gap: var(--s1); }
  .pflag { width: 16px; height: 12px; border-radius: 2px; overflow: hidden; flex: none; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.22); }
  .pflag img { width: 100%; height: 100%; display: block; }
  .ctry span { font-size: var(--fs-sec); font-weight: 500; line-height: var(--lh-sec); color: var(--t2); white-space: nowrap; }
  .xbtn { flex: none; width: var(--ctl); height: var(--ctl); border-radius: var(--r-ctl); display: grid; place-items: center; color: var(--t1);
    background: rgba(234, 242, 247, 0.06); box-shadow: inset 0 0 0 1px rgba(127, 233, 255, 0.10); }

  /* status: the engine's five fields in one strip (label over value, like the indicator strip) */
  .status { flex: none; margin-top: var(--g-blk); display: grid; grid-template-columns: auto 1px auto 1px auto 1px auto; justify-content: space-between; align-items: center; }
  .sf { display: flex; flex-direction: column; }
  .sf dt { font-size: var(--fs-label); font-weight: 500; line-height: var(--lh-label); color: var(--t2); white-space: nowrap; }
  .sf dd { font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); color: var(--t1); white-space: nowrap; }
  .vr { width: 1px; height: 20px; background: var(--hair); }
  /* status fit 1 (measured): long values, as in disputed or occupied provinces (sovereign, administrator and
     controller all different, a long claims list), do not fit one strip: two rows of label + value pairs */
  [data-status="1"] .status { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); justify-content: stretch; column-gap: var(--s3); row-gap: var(--s1); }
  [data-status="1"] .vr { display: none; }
  [data-status="1"] .sf { height: var(--lh-val); flex-direction: row; align-items: baseline; gap: var(--s2); min-width: 0; }   /* 16 pt rows: baseline alignment of 10 and 13 pt text would add 1 pt per row */
  [data-status="1"] .sf dt { line-height: var(--lh-val); }

  /* headline numbers: three 44 pt tiles; the whole tile is the «لماذا؟» link to the why-sheet */
  .kpis { flex: none; margin-top: var(--g-blk); display: flex; gap: var(--s2); }
  .kpi { flex: 1 1 0; min-width: 0; height: var(--dock-h); border-radius: var(--r-ctl); padding-inline: var(--s2); display: flex; flex-direction: column; justify-content: center;
    background: rgba(234, 242, 247, 0.05); box-shadow: inset 0 0 0 1px rgba(127, 233, 255, 0.10); text-align: right; }
  .k-l { height: var(--lh-label); display: flex; align-items: center; gap: var(--s1); }
  .k-v { height: var(--lh-val); display: flex; align-items: baseline; gap: var(--s2); }
  .k-v .why { margin-inline-start: auto; font-size: var(--fs-sec); font-weight: 600; line-height: var(--lh-val); color: var(--cyan); white-space: nowrap; }
  .trend.bad { color: var(--amber); }

  /* segmented tab row, 32 pt */
  .seg { flex: none; margin-top: var(--s2); height: var(--ctl); display: flex; border-radius: var(--r-ctl);
    background: rgba(234, 242, 247, 0.05); box-shadow: inset 0 0 0 1px rgba(127, 233, 255, 0.10); }
  .sg { flex: 1 1 0; min-width: 0; height: var(--ctl); border-radius: var(--r-ctl); display: grid; place-items: center; color: var(--t2); }
  .sg span { font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); white-space: nowrap; }
  .sg[aria-selected="true"] { color: var(--cyan); background: rgba(127, 233, 255, 0.14); box-shadow: inset 0 0 0 1px rgba(127, 233, 255, 0.50); }

  /* tab content (never scrolls; as tall as the tallest tab) + the action card pinned at the bottom */
  .body { flex: 1 1 auto; min-height: 0; margin-top: var(--g-det); display: flex; flex-direction: column; gap: var(--g-det); }
  .tabs { flex: none; }
  .pane { display: none; flex-direction: column; gap: var(--s1); }
  [data-tab="politics"] .pane[data-tab="politics"], [data-tab="society"] .pane[data-tab="society"],
  [data-tab="economy"] .pane[data-tab="economy"], [data-tab="security"] .pane[data-tab="security"] { display: flex; }
  .kv { height: var(--lh-val); display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); }
  .kv .k { font-size: var(--fs-sec); font-weight: 500; line-height: var(--lh-val); color: var(--t2); white-space: nowrap; }
  .kv .v { font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); color: var(--t1); white-space: nowrap; }
  /* population groups: a slim stacked bar between its two labels */
  .groups { height: var(--lh-val); display: flex; align-items: center; gap: var(--s2); }
  .groups > span { font-size: var(--fs-sec); font-weight: 500; line-height: var(--lh-val); color: var(--t1); white-space: nowrap; }
  .gbar { flex: 1 1 auto; min-width: 44px; height: 6px; display: flex; border-radius: 3px; overflow: hidden; }
  .gbar i { display: block; height: 100%; }
  .gbar i:first-child { background: rgba(127, 233, 255, 0.75); }
  .gbar i:last-child { background: rgba(169, 188, 203, 0.45); border-right: 1px solid rgb(12, 20, 28); }

  /* margin-top: auto pins the card to the bottom; fitSheet() caps it to whole rows and it scrolls the rest */
  .acts { flex: 0 1 auto; min-height: 0; margin-top: auto; overflow-y: auto; display: flex; flex-direction: column; border-radius: var(--r-bar);
    background: rgba(234, 242, 247, 0.04); box-shadow: inset 0 0 0 1px rgba(127, 233, 255, 0.10); }
  .act { flex: none; }
  .act { height: var(--dock-h); border-radius: var(--r-ctl); padding-inline: var(--pad-bar); display: grid; align-items: center; text-align: right;
    grid-template-columns: var(--ico) minmax(0, 1fr) auto var(--ico); grid-template-rows: var(--lh-val) var(--lh-label); column-gap: var(--s2); align-content: center; }
  .act + .act::after { content: ""; position: absolute; top: 0; left: var(--pad-bar); right: var(--pad-bar); height: 1px; background: var(--hair); }
  .act .a-ico { grid-row: 1 / 3; grid-column: 1; color: var(--teal); }
  .act .a-t { grid-row: 1; grid-column: 2; font-size: var(--fs-val); font-weight: 600; line-height: var(--lh-val); color: var(--t1); white-space: nowrap; }
  .act .a-c { grid-row: 1; grid-column: 3; font-size: var(--fs-sec); font-weight: 500; line-height: var(--lh-val); color: var(--t2); white-space: nowrap; }
  .act .a-e { grid-row: 2; grid-column: 2 / 4; display: flex; align-items: center; gap: var(--s1); white-space: nowrap; }
  .act .a-e span { font-size: var(--fs-label); font-weight: 700; line-height: var(--lh-label); }
  .act .chev { grid-row: 1 / 3; grid-column: 4; color: var(--t2); }
  .good { color: var(--blue); }
  .harm { color: var(--amber); }
  .a-e .dot { color: var(--t2); }
  .a-e .eff { display: flex; align-items: center; gap: var(--s1); }

  /* the card's scroll indicator, beside the card on the RTL side (shown only while rows are scrolled away) */
  .sbar { display: none; position: absolute; left: 4px; width: 3px; border-radius: 1.5px; background: rgba(169, 188, 203, 0.55); pointer-events: none; }
  [data-actscroll="1"] .sbar { display: block; }

  /* map labels and city dots: drawn left-to-right exactly as inside the overlay image; a label (or a city's
     dot and name) that a panel edge would slice is hidden (placeMap), so each is whole or fully under a panel */
  .map svg.labels { position: absolute; inset: 0; width: 100%; height: 100%; direction: ltr; }
  .labels .cut { display: none; }

  /* the tapped province on the map: teal outline like the player's country, tighter */
  .map svg.sel { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .sel path { vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  /* ================= Screen 14, variant A: the military map (D-15: units that glide along their route) =================
     The approved play screen (B3 with opaque panels) in the military map mode. Units sit on the map at fixed size (the map
     zooms, the units do not), each the owner's generic image (tank, destroyer, fighter) under a small tag with the flag
     and the strength (formations, ships or aircraft). The selected army has a teal ring, its route a dashed teal line through its
     waypoint to the destination, and the order bar takes the dock's place while it is selected. */
  .units { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .units .tap { pointer-events: auto; }
  /* a unit: the owner's generic image (28 pt tall) under its 20 pt tag (flag and strength); the image's centre is the unit's place */
  .u-tok { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 0; background: none; border: 0; color: var(--t1); }
  .u-tag { height: 20px; display: flex; align-items: center; gap: var(--s1); padding-inline: 4px 5px; border-radius: 4px;
    background: rgb(12, 20, 28); border: 1px solid var(--stroke); box-shadow: 0 1px 4px rgba(0, 0, 0, .45); }
  .u-tag .u-flag { flex: none; width: 12px; height: 9px; border-radius: 1.5px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255, 255, 255, .22); }
  .u-tag .u-flag img { width: 100%; height: 100%; display: block; }
  .u-tag b { font-size: var(--fs-val); line-height: var(--lh-val); font-weight: 600; font-variant-numeric: tabular-nums; }
  .u-img { height: 28px; width: auto; display: block; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .55)); }
  /* two armies in one province: a second tag edge behind the first */
  .u-tok.u-stack .u-tag { box-shadow: 3px -3px 0 -1px rgb(12, 20, 28), 3px -3px 0 0 rgba(127, 233, 255, .35), 0 1px 4px rgba(0, 0, 0, .45); }
  /* the selected unit: its tag ringed in teal */
  .u-tok[aria-pressed="true"] .u-tag { outline: 2px solid var(--teal); outline-offset: 1px; }
  /* the route: a dark halo under a dashed teal line, an arrowhead at the destination; the waypoint numbered; the
     destination a small pill with a pin */
  .route { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .route .halo { fill: none; stroke: rgba(11, 18, 24, .75); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .route .line { fill: none; stroke: var(--teal); stroke-width: 2.5; stroke-dasharray: 6 5; stroke-linecap: round; stroke-linejoin: round; }
  .route .head { fill: var(--teal); stroke: rgba(11, 18, 24, .75); stroke-width: 1; }
  .u-wp { position: absolute; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgb(12, 20, 28); box-shadow: inset 0 0 0 2px var(--teal); font-size: var(--fs-label); line-height: var(--lh-label); font-weight: 700; color: var(--t1); }
  .u-dest { position: absolute; height: 20px; display: flex; align-items: center; gap: 2px; padding-inline: 6px 7px; border-radius: 6px;
    background: rgb(12, 20, 28); box-shadow: inset 0 0 0 1px var(--teal); font-size: var(--fs-sec); line-height: var(--lh-sec); font-weight: 600; color: var(--t1); white-space: nowrap; }
  .u-dest svg.i { width: var(--glyph); height: var(--glyph); color: var(--teal); }
  [data-route="0"] .route, [data-route="0"] .u-wp, [data-route="0"] .u-dest { display: none; }

  /* the order bar: in the dock's place while an army is selected (the dock comes back when it is closed) */
  .orders { flex: none; align-self: center; height: var(--dock-h); display: none; align-items: center; gap: var(--s1); padding-inline: var(--s2); }
  [data-sel="1"] .orders { display: flex; }
  [data-sel="1"] .dock { display: none; }
  .o-unit { display: flex; align-items: center; gap: var(--s2); padding-inline: var(--s1) var(--s2); }
  .o-unit .flag { width: 22px; height: 16.5px; }
  .o-tt { display: flex; flex-direction: column; }
  .o-tt b { font-size: var(--fs-val); line-height: var(--lh-val); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--t1); white-space: nowrap; }
  .o-tt span { font-size: var(--fs-label); line-height: var(--lh-label); font-weight: 500; color: var(--t2); white-space: nowrap; }
  .o-btn { min-width: 44px; height: 36px; padding-inline: var(--s2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border-radius: 8px; color: var(--t2); }
  .o-btn svg.i { width: var(--ico); height: var(--ico); color: var(--t1); }
  .o-btn span { font-size: var(--fs-label); line-height: var(--lh-label); font-weight: 500; white-space: nowrap; }
  /* the order in force: a white touch (filled white, dark ink) */
  .o-btn.on { background: var(--t1); color: rgb(11, 18, 24); }
  .o-btn.on svg.i { color: rgb(11, 18, 24); }
  /* not available now (no war): grey, with a lock instead of its glyph */
  .o-btn[aria-disabled="true"] svg.i { color: var(--t2); }
  .o-sep { flex: none; width: 1px; height: 24px; background: var(--stroke); }
  /* why attack is locked: a 32 pt note above the bar, centred on the attack button */
  .o-tip { position: absolute; bottom: calc(var(--dock-h) + var(--s2)); height: var(--ctl); margin: 0; display: flex; align-items: center;
    padding-inline: var(--pad-ctl); font-size: var(--fs-sec); line-height: var(--lh-sec); font-weight: 500; color: var(--t1); white-space: nowrap; }
  .o-tip[hidden] { display: none; }
</style>
</head>

<script>
  /* Condense the nation card step by step until the top row fits the safe width
     (nation + 8 + indicators + 8 + date/speed pill). */
  function fitTop() {
    var root = document.documentElement, top = document.querySelector('.top');
    var kids = [document.querySelector('.nation'), document.querySelector('.stats'), document.querySelector('.date')];
    var gap = parseFloat(getComputedStyle(top).columnGap) || 0;
    for (var lv = 0; lv <= 3; lv++) {
      root.dataset.fit = String(lv);
      var need = kids.reduce(function (a, e) { return a + e.getBoundingClientRect().width; }, 0) + gap * (kids.length - 1);
      if (need <= top.clientWidth + 0.01) break;
    }
    window.__fit = { level: +root.dataset.fit, need: need, avail: top.clientWidth };
  }

  /* ---------- The military map (D-15) ----------
     Map space is the overlay's 1688 x 1097 (Egypt's box centre (764, 578) sits at --map-cx/--map-cy, scaled by --map-s).
     Units are placed in screen points from their map positions, so they keep their size while the map zooms. */
  var $ = function (sel) { return document.querySelector(sel); };
  var UNITS = {
    west:   { kind: 'army', name: 'المنطقة الغربية', n: 4, at: [659, 434], place: 'مطروح', org: 76 },
    north:  { kind: 'army', name: 'المنطقة الشمالية', n: 4, at: [739, 441], place: 'الإسكندرية', org: 75 },
    cairo:  { kind: 'stack', name: 'القاهرة', n: 6, at: [777, 478], parts: [['المنطقة المركزية', 5], ['الحرس الجمهوري', 1]] },
    second: { kind: 'army', name: 'الجيش الثاني الميداني', n: 7, at: [810, 450], place: 'القناة', org: 80 },
    third:  { kind: 'army', name: 'الجيش الثالث الميداني', n: 6, at: [816, 481], place: 'السويس', org: 78 },
    fleet:  { kind: 'ship', name: 'أسطول المتوسط', n: 10, at: [735, 411], place: 'الإسكندرية' },
    air:    { kind: 'plane', name: 'مجموعة جوية', n: 24, at: [773, 509], place: 'بني سويف' }
  };
  /* the western army's route: from Marsa Matruh down the desert road (one waypoint) to the Siwa oasis near the Libyan border */
  var ROUTE = { unit: 'west', pts: [[659, 434], [637, 468], [608, 504]], to: 'سيوة' };
  var KM = { x: 3.23, y: 3.40 }, KMDAY = 40;                 /* km per map unit (at 31° N); a march of 40 km a day */
  var legs = [], TOTAL = 0;
  for (var i = 1; i < ROUTE.pts.length; i++) {
    var a = ROUTE.pts[i - 1], b = ROUTE.pts[i], km = Math.hypot((b[0] - a[0]) * KM.x, (b[1] - a[1]) * KM.y);
    legs.push({ a: a, b: b, km: km, from: TOTAL }); TOTAL += km;
  }
  var DAYS = TOTAL / KMDAY;                                  /* the whole march in days */

      $('.spd .ltr').textContent = sp === 30 ? 'أقصى' : sp + '×'; $('.spd').setAttribute('aria-label', 'السرعة ' + (sp === 30 ? 'أقصى' : sp + '×'));
      wire(); go();
    }
    window.__live = LIVE;
  }

  /* Frosted glass for the mockup render. The headless Chromium used for these PNGs leaves a sharp
     copy of image content under backdrop-filter (map labels showed through the panels). So each
     panel gets its own clipped copy of the map, blurred with filter: blur(), under the 0.66 tint:
     the same look the native blur gives in the app. backdrop-filter stays as the fallback. */
  function frost() {
    var m = document.querySelector('.map').getBoundingClientRect();
    Array.prototype.forEach.call(document.querySelectorAll('.hud .glass'), function (g) {
      var f = g.querySelector(':scope > .frost');
      if (!f) {
        f = document.createElement('span'); f.className = 'frost'; f.setAttribute('aria-hidden', 'true');
        f.appendChild(document.createElement('i'));
        g.insertBefore(f, g.firstChild);
      }
      var r = g.getBoundingClientRect(), cs = getComputedStyle(g), i = f.firstChild;
      i.style.left = (m.left - r.left - parseFloat(cs.borderLeftWidth)) + 'px';
      i.style.top = (m.top - r.top - parseFloat(cs.borderTopWidth)) + 'px';
      i.style.width = m.width + 'px';
      i.style.height = m.height + 'px';
    });
    document.documentElement.classList.add('frosted');
  }

  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
    .then(fitTop).then(startUnits).then(frost).then(function () { window.__ready = true; });
</script>
</body>
