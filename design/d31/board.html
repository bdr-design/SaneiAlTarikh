<h1>الصف العلوي في الجوالات الصغيرة (D-31)</h1>
<p>شاشة اللعب المعتمدة (B3). سلسلة التصغير: 1 النظام تحت الاسم، 2 الاسم وحده، 3 مؤشرات أضيق، 4 العلم وحده (الاسم في لوحة الدولة وفي قراءة VoiceOver)، 5 السنة بجانب اليوم. لا مشاكل.</p>
